# main への push と PR で、Chrome 拡張と VS Code 拡張の型・テスト・ビルドを確かめる
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      # vscode/ は ../src/core を読むので、ルートの依存も入れる
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
